# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      "Docker":
        patterns:
          - "*"
    ignore:
      # The Dockerfile's Ruby base image must stay on the same minor series as
      # the Gemfile's `ruby` directive (see .ruby-version). Dependabot cannot
      # group updates across package ecosystems, so the series is pinned here
      # and both are moved together in a single pull request.
      - dependency-name: "ruby"
        versions: [">= 3.5.0"]
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      "Actions":
        patterns:
          - "*"
  - package-ecosystem: "bundler" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      "Ruby":
        patterns:
          - "*"
